name: Publish new tag and pre-release when version is bumped

on:
  workflow_call:
    inputs:
      image:
        type: string
        description: "The name of the image to build"
        required: false
        default: "osrf/ros:humble-desktop-full"
      path:
        type: string
        description: "The path to the package.xml"
        required: false
        default: "package.xml"
      changelog:
        type: string
        description: "Path of a CHANGELOG.md whose section of the tagged version becomes the release body. Empty means notes generated by GitHub."
        required: false
        default: ""
      assets:
        type: boolean
        description: "Attach Debian packages (bloom) and the API documentation (rosdoc2) to the release, built by ros2-release.yml."
        required: false
        default: false
      assets-distribution:
        type: string
        description: "ROS 2 distribution of the attached Debian packages."
        required: false
        default: "jazzy"
      assets-packages:
        type: string
        description: "Packages to package and document, whitespace separated. Empty means every package."
        required: false
        default: ""
      runner:
        type: string
        description: "Runner of the release job, for example sonu-github-arc. Empty means the runner group default, as before."
        required: false
        default: ""
      toolkit-ref:
        type: string
        description: "Revision of catie-aq/ros_workflows whose scripts the release job uses (changelog)."
        required: false
        default: "main"
    outputs:
      bump:
        description: "Whether the version was bumped and tagged."
        value: ${{ jobs.bump-tag.outputs.bump }}
      version:
        description: "Version read from package.xml."
        value: ${{ jobs.bump-tag.outputs.version }}

jobs:
  bump-tag:
    uses: catie-aq/generic_workflows/.github/workflows/autotag.yml@main
    with:
      image: ${{ inputs.image }}
      version_cmd: grep "<version>" ${{ inputs.path}} | sed -n 's|<version>\(.*\)</version>|\1|p' | tr -d ' '

  assets:
    needs: bump-tag
    if: ${{ inputs.assets && needs.bump-tag.outputs.bump == 'true' }}
    uses: catie-aq/ros_workflows/.github/workflows/ros2-release.yml@main
    with:
      runner: ${{ inputs.runner || 'sonu-github-arc' }}
      distribution: ${{ inputs.assets-distribution }}
      packages: ${{ inputs.assets-packages }}
      toolkit-ref: ${{ inputs.toolkit-ref }}

  draft-release:
    needs: [bump-tag, assets]
    if: ${{ !cancelled() && needs.bump-tag.outputs.bump == 'true' && needs.assets.result != 'failure' }}
    runs-on: ${{ inputs.runner != '' && inputs.runner || fromJSON('{"group":"default"}') }}
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ros_workflows
        if: ${{ inputs.changelog != '' }}
        uses: actions/checkout@v4
        with:
          repository: catie-aq/ros_workflows
          ref: ${{ inputs.toolkit-ref }}
          path: .ros_workflows

      - name: Release notes from the changelog
        id: notes
        if: ${{ inputs.changelog != '' }}
        shell: bash
        env:
          CHANGELOG: ${{ inputs.changelog }}
          VERSION: ${{ needs.bump-tag.outputs.version }}
        run: |
          if python3 .ros_workflows/scripts/changelog_section.py "${CHANGELOG}" "${VERSION}" --output "${RUNNER_TEMP}/release-notes.md"; then
            echo "path=${RUNNER_TEMP}/release-notes.md" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::No section ${VERSION} in ${CHANGELOG}: release notes generated by GitHub."
          fi

      - name: Download assets
        if: ${{ needs.assets.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Package assets
        if: ${{ needs.assets.result == 'success' }}
        shell: bash
        env:
          VERSION: ${{ needs.bump-tag.outputs.version }}
        run: |
          mkdir -p release-files
          find release-assets -name '*.deb' -exec cp {} release-files/ \;
          if [ -d release-assets/api-docs ]; then
            tar -czf "release-files/api-docs-${VERSION}.tar.gz" -C release-assets api-docs
          fi
          ls -l release-files

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          tag_name: ${{ needs.bump-tag.outputs.version }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          body_path: ${{ steps.notes.outputs.path }}
          files: ${{ needs.assets.result == 'success' && 'release-files/*' || '' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
